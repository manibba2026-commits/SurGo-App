analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

  # Balanced severity for lints that are already all over the codebase. These
  # stay visible in `flutter analyze` output but no longer fail CI, so style
  # debt in existing screens can't block a deploy. Errors and genuine warnings
  # are still fatal.
  errors:
    prefer_const_constructors: ignore
    deprecated_member_use: ignore
    unnecessary_brace_in_string_interps: ignore

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
