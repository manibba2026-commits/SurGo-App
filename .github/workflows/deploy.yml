name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        # Lint severity is tuned in analysis_options.yaml. Infos and the
        # cosmetic rules ignored there are reported but not fatal; errors and
        # real warnings still fail the job.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test
